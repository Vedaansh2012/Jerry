
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JERRY — Your AI Friend</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Trebuchet MS',sans-serif;
  background:#fffaf1;
  color:#302a42;
  min-height:100vh;
  background-image:radial-gradient(#e8dfff 1px,transparent 1px);
  background-size:23px 23px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 7%;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:3px;
  color:#7455d9;
}

.tagline{
  font-size:12px;
  color:#9589a8;
}

main{
  max-width:760px;
  margin:35px auto;
  padding:20px;
  text-align:center;
}

.mascot{
  width:125px;
  height:125px;
  border-radius:43% 57% 52% 48%;
  background:linear-gradient(140deg,#a994ff,#8063e9);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 22px;
  font-size:62px;
  box-shadow:8px 10px 0 #e4d9ff;
  transform:rotate(-5deg);
  animation:bob 3s ease-in-out infinite;
}

@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-5deg)}
  50%{transform:translateY(-9px) rotate(5deg)}
}

.sparkle{
  color:#f4a85e;
  font-size:26px;
}

h1{
  font-size:clamp(32px,6vw,49px);
  margin:10px 0;
  line-height:1.2;
}

h1 span{color:#8063e9}

.subtitle{
  color:#8d829d;
  font-size:15px;
  line-height:1.7;
  margin:12px auto 28px;
  max-width:480px;
}

.chat{
  background:white;
  border:2px solid #eee5ff;
  border-radius:25px;
  padding:17px;
  box-shadow:0 12px 35px #7356b416;
  text-align:left;
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  gap:10px;
}

.language{
  border:1px solid #e9e1fb;
  background:#faf7ff;
  padding:9px;
  border-radius:12px;
  color:#66558d;
  font-size:12px;
  max-width:175px;
}

.online{
  font-size:11px;
  color:#6a9d73;
}

textarea{
  width:100%;
  border:0;
  outline:none;
  resize:none;
  min-height:75px;
  font:16px inherit;
  font-family:inherit;
  color:#302a42;
  padding:12px 5px;
  background:transparent;
}

textarea::placeholder{color:#b3aabd}

.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid #f0ebf8;
  padding-top:13px;
}

.mic,.send{
  border:0;
  cursor:pointer;
  font-size:17px;
  border-radius:14px;
  padding:12px 19px;
}

.mic{
  background:#f0eaff;
  color:#785bd8;
}

.mic.listening{
  background:#ffe2e8;
  color:#d04e75;
}

.send{
  background:#8063e9;
  color:white;
  font-size:14px;
  font-weight:bold;
}

.mic:hover,.send:hover{transform:scale(1.04)}

.quick{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:22px 0;
}

.quick button{
  border:1px solid #e9dfff;
  background:white;
  border-radius:30px;
  padding:10px 15px;
  color:#71628d;
  cursor:pointer;
  font-size:12px;
}

.quick button:hover{background:#f1ebff}

.conversation{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin:18px 0;
  text-align:left;
}

.bubble{
  padding:14px 17px;
  border-radius:19px;
  max-width:88%;
  font-size:14px;
  line-height:1.6;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.user{
  background:#8063e9;
  color:white;
  align-self:flex-end;
  border-bottom-right-radius:5px;
}

.jerry{
  background:#eee8ff;
  color:#493c69;
  align-self:flex-start;
  border-bottom-left-radius:5px;
}

.footer{
  color:#aa9fb5;
  font-size:11px;
  margin-top:25px;
}

@media(max-width:550px){
  header{padding:18px}
  main{margin:15px auto;padding:15px}
  .mascot{width:105px;height:105px;font-size:50px}
  .chat{padding:13px}
  .tagline{font-size:10px}
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ JERRY</div>
  <div class="tagline">YOUR LITTLE DIGITAL SIDEKICK</div>
</header>

<main>

  <div class="sparkle">✧ &nbsp; ✦ &nbsp; ✧</div>

  <div class="mascot">☺</div>

  <h1>Hey! I'm <span>Jerry.</span></h1>

  <p class="subtitle">
    Your ideas, your tasks, your digital world.
    Just talk to me. Let's get things done!
  </p>

  <div class="chat">

    <div class="topline">
      <span class="online">● Ready for your request</span>

      <select class="language" id="language">
        <option value="auto">🌍 Auto / Browser language</option>
        <option value="en-US">English</option>
        <option value="hi-IN">हिन्दी</option>
        <option value="as-IN">অসমীয়া</option>
        <option value="bn-IN">বাংলা</option>
        <option value="ta-IN">தமிழ்</option>
        <option value="te-IN">తెలుగు</option>
        <option value="mr-IN">मराठी</option>
        <option value="gu-IN">ગુજરાતી</option>
        <option value="pa-IN">ਪੰਜਾਬੀ</option>
        <option value="ur-PK">اردو</option>
        <option value="fr-FR">French</option>
        <option value="es-ES">Spanish</option>
        <option value="de-DE">German</option>
        <option value="ja-JP">Japanese</option>
      </select>
    </div>

    <form id="form">

      <textarea
        id="input"
        placeholder="Tell Jerry what you need..."
        required
      ></textarea>

      <div class="actions">

        <button type="button" class="mic" id="mic">
          🎙 Speak
        </button>

        <button type="submit" class="send">
          Let's go ↗
        </button>

      </div>

    </form>
  </div>

  <div class="quick">
    <button data-prompt="Help me write a message">💌 Write something</button>
    <button data-prompt="Help me plan my day">☀️ Plan my day</button>
    <button data-prompt="Find information about something">🔎 Find something</button>
  </div>

  <div class="conversation" id="conversation"></div>

  <p class="footer">
    Made with curiosity ✦ Powered by possibilities
  </p>

</main>

<script>
const form=document.getElementById("form");
const input=document.getElementById("input");
const conversation=document.getElementById("conversation");
const mic=document.getElementById("mic");
const language=document.getElementById("language");

function bubble(message,type){
  const el=document.createElement("div");
  el.className="bubble "+type;
  el.textContent=message;
  conversation.appendChild(el);
}

function reply(text){
  bubble(text,"user");

  // Working local timer
  const isTimer=/\b(timer|countdown)\b/i.test(text);
  const match=text.match(/\b(\d+)\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?)\b/i);

  if(isTimer && match){
    const amount=Number(match[1]);
    const unit=match[2].toLowerCase();
    const multiplier=unit.startsWith("h")?3600000:
      unit.startsWith("m")?60000:1000;
    const duration=amount*multiplier;

    bubble("⏱ Your "+amount+" "+unit+" timer has started!","jerry");

    setTimeout(()=>{
      bubble("🔔 Time's up! Your timer is finished.","jerry");
      document.title="⏰ Timer finished — JERRY";
    },duration);

    return;
  }

  if(/\b(time|date)\b/i.test(text)){
    bubble("It's "+new Date().toLocaleString()+" on your device.","jerry");
    return;
  }

  bubble(
    "Got it! I have received your request. My full AI brain and app connections are not connected yet. We'll add those next so I can understand and complete your requests.",
    "jerry"
  );
}

form.addEventListener("submit",e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;
  reply(text);
  input.value="";
});

document.querySelectorAll("[data-prompt]").forEach(button=>{
  button.addEventListener("click",()=>{
    input.value=button.dataset.prompt;
    input.focus();
  });
});

// Voice input
mic.addEventListener("click",()=>{
  const SpeechRecognition=
    window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    bubble(
      "Voice input isn't supported by this browser. Try a supported browser or type your request.",
      "jerry"
    );
    return;
  }

  const recognition=new SpeechRecognition();

  recognition.lang=language.value==="auto"
    ?(navigator.language||"en-US")
    :language.value;

  recognition.interimResults=false;
  recognition.maxAlternatives=1;

  recognition.onstart=()=>{
    mic.textContent="🔴 Listening...";
    mic.classList.add("listening");
  };

  recognition.onresult=event=>{
    input.value=event.results[0][0].transcript;
    input.focus();
  };

  recognition.onerror=()=>{
    bubble("I couldn't hear that clearly. Please try again or type your request.","jerry");
  };

  recognition.onend=()=>{
    mic.textContent="🎙 Speak";
    mic.classList.remove("listening");
  };

  try{
    recognition.start();
  }catch(error){
    bubble("Voice input could not start. Please try again.","jerry");
  }
});
</script>

</body>
</html>
